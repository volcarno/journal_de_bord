<div id="lightbox" style="display:none; position:fixed; z-index:9999; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); cursor:pointer; align-items:center; justify-content:center;">
      <img id="lightbox-img" src="" style="max-width:95%; max-height:95%; border:3px solid white; border-radius:5px;">
  </div>

  <script>
    // On enveloppe tout dans un écouteur pour être sûr que le HTML est chargé
    document.addEventListener("DOMContentLoaded", function() {
        const filter = document.getElementById('tagFilter');
        const images = document.querySelectorAll('#gallery .image');

        function applyFilter(value) {
            images.forEach(img => {
                const tags = img.dataset.tags.split(' ');
                if (value === 'all' || tags.includes(value)) {
                    img.classList.remove('hidden');
                } else {
                    img.classList.add('hidden');
                }
            });
            filter.value = value;
        }

        filter.addEventListener('change', () => { applyFilter(filter.value); });

        const params = new URLSearchParams(window.location.search);
        const tag = params.get('tag');
        applyFilter(tag || 'all');

        // GESTION DE L'OUVERTURE EN PLEIN ÉCRAN
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');

        document.querySelectorAll('.gallery img').forEach(image => {
            image.onclick = () => {
                lightbox.style.display = 'flex';
                lightboxImg.src = image.src;
            };
        });

        lightbox.onclick = () => { lightbox.style.display = 'none'; };
    });
  </script>
